<div class="contenido">

  <h2>Comité de Ética</h2>

  <!-- ================= TABS PRINCIPAL ================= -->
  <ul class="nav nav-tabs custom-tabs">

    <li>
      <button
        class="nav-link active"
        type="button">
        COMITÉ DE ÉTICA
      </button>
    </li>

  </ul>


  <!-- ================= CONTENIDO ================= -->
  <div class="tab-content box-content">

    <div class="tab-pane fade show active">


      <!-- ================= AÑOS ================= -->
      <div class="anios-nav">

        <button
          *ngFor="let anio of data"
          type="button"
          class="anio-tab"
          [class.active]="anio.abierto"
          (click)="seleccionarAnio(anio)">

          {{ anio.anio }}

        </button>

      </div>


      <!-- ================= CONTENIDO DEL AÑO ================= -->
      <div
        *ngFor="let anio of data"
        class="anio-contenido"
        [class.visible]="anio.abierto">

        <!-- TRIMESTRES -->
        <div
          class="trimestre"
          *ngFor="let t of anio.trimestres">

          <!-- ENCABEZADO TRIMESTRE -->
          <div
            class="trimestre-header"
            (click)="t.abierto = !t.abierto">

            <span class="trimestre-icon">📁</span>

            <span>{{ t.nombre }}</span>

          </div>


          <!-- ARCHIVOS -->
          <ul
            *ngIf="t.abierto"
            class="archivos-list">

            <li *ngFor="let doc of t.archivos">

              <img
                src="assets/vinculacion/pdf.png"
                alt="PDF">

              <a
                [href]="doc.url"
                target="_blank"
                rel="noopener noreferrer">

                {{ doc.nombre }}

              </a>

            </li>

          </ul>

        </div>

      </div>

    </div>

  </div>

</div>
