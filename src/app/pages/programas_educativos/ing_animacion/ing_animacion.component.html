          <li>Capacidad de observación, análisis y síntesis para la resolución de problemas </li>
          <li>Gusto por el trabajo colaborativo y apertura a la integración en equipos multidisciplinarios.</li>
          <li>Valores de responsabilidad, compromiso y ética, que permitan desempeñarse en un entorno académico y profesional.</li>

        <ul>
          <li>Crear gráficas diseñadas por ordenador (CGI) de calidad utilizando software especializado </li>
          <li>Aplica, identifica y genera recursos artísticos, para el desarrollo de proyectos dentro de las industrias del entretenimiento y medios digitales. </li>
          <li>Analiza y sintetiza ideas narrativas para que en colaboración con un equipo multidisciplinario de trabajo sea capaz comunicar efectivamente con diferentes audiencias.</li>
          <li>Desarrolla, colabora y organiza planes de trabajo dentro de una producción de equipos multidisciplinarios para generar un producto de calidad. </li>
          <li>Interpreta datos e implementa procesos de programación enfocada a gráficos computacionales CGI y diseño de videojuegos.</li>
          <li>Reconoce necesidades dentro de los negocios de las industrias digitales; organiza, administra y emprende proyectos de innovación. </li>
          <li>Domina procesos lógico-matemáticos, físicos y estructurales para la simulación aplicada a entornos gráficos computacionales</li>
          <li>Aplica modelos psicológicos funcionales para el desarrollo profesional.</li>
          <li>Aplica la ética y responsabilidad social a su trabajo profesional.</li>
