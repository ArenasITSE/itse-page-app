<div class="contenido">

  <h2>Comité de Ética</h2>

  <!-- TABS -->
  <ul class="nav nav-tabs custom-tabs">

    <li>
      <button
        class="nav-link active"
        data-bs-toggle="tab"
        data-bs-target="#tab1">
        COMITÉ DE ÉTICA
      </button>
    </li>

  </ul>

  <!-- CONTENIDO TAB -->
  <div class="tab-content box-content">

    <div class="tab-pane fade show active" id="tab1">

      <div class="anio-card" *ngFor="let anio of data">

        <!-- AÑO -->
        <div
          class="anio-header"
          (click)="anio.abierto = !anio.abierto">

          📁 {{ anio.anio }}

        </div>

        <div
          *ngIf="anio.abierto"
          class="anio-body">

          <!-- TRIMESTRES -->
          <div
            class="trimestre"
            *ngFor="let t of anio.trimestres">

            <div
              class="trimestre-header"
              (click)="t.abierto = !t.abierto">

              📂 {{ t.nombre }}

            </div>

            <!-- ARCHIVOS PDF -->
            <ul
              *ngIf="t.abierto"
              class="archivos-list">

              <li *ngFor="let doc of t.archivos">

                <img
                  src="assets/vinculacion/pdf.png"
                  alt="pdf">

                <a
                  [href]="doc.url"
                  target="_blank">

                  {{ doc.nombre }}

                </a>

              </li>

            </ul>

          </div>

        </div>

      </div>

    </div>

  </div>

</div>
