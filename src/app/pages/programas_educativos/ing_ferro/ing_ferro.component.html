      <p>

      </p>
    </div>

      <div class="info-block">
      <h3>■ OBJETIVOS EDUCACIONALES </h3>
      <ul>
        <li>Formar ingenieros ferroviarios con conocimientos sólidos en diseño, construcción, operación y mantenimiento de sistemas ferroviarios.</li>
        <li>Desarrollar habilidades para la resolución de problemas técnicos en la industria ferroviaria, utilizando herramientas de simulación, análisis y optimización</li>
        <li>Fomentar el uso y adaptación de nuevas tecnologías en el sector ferroviario para mejorar la eficiencia y seguridad del transporte</li>
        <li>Promover la responsabilidad social y ambiental en el ejercicio profesional, asegurando el cumplimiento de normativas y buenas prácticas</li>
        <li>Impulsar el liderazgo y el trabajo en equipo para la gestión efectiva de proyectos ferroviarios.</li>
        <li>Desarrollar habilidades de comunicación efectiva y principios éticos en el ámbito profesional.</li>
      </ul>
    </div>

    <div class="info-block">
      <h3>■ MISIÓN</h3>
      <p>
      Formar ingenieros ferroviarios con un alto sentido de responsabilidad social y ambiental, capaces de diseñar, construir, operar y mantener sistemas ferroviarios de manera eficiente y sostenible. A través de una educación integral y de calidad, impulsamos el desarrollo de competencias tecnológicas, analíticas y de liderazgo, contribuyendo al crecimiento del sector ferroviario y al bienestar de la sociedad.
      </p>
    </div>

     <div class="info-block">
      <h3>■ VISIÓN</h3>
      <p>
      Ser un referente en la formación de profesionales en ingeniería ferroviaria en el Estado de Campeche y en el país, reconocidos por su excelencia académica, innovación tecnológica y compromiso con el desarrollo sustentable del sector ferroviario. Nos consolidamos como un programa educativo alineado con las tendencias globales del transporte ferroviario, contribuyendo al desarrollo económico y social de la región.
      </p>
    </div>

          <li>Actitud proactiva y trabajo en equipo</li>

          <li>Utiliza y adapta nuevas tecnologías para la mejora en los procesos de sistemas ferroviarios</li>
